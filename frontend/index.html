<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Etiquetas com QR anti-fraude</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>Etiquetas em Massa com QRCode Único</h1>
      <p>Template editável em tempo real + verificação de autenticidade.</p>
    </header>

    <main class="grid">
      <section class="card">
        <h2>1) Dados base</h2>
        <label>Produto <input id="product" value="Cápsula Premium" /></label>
        <label>Lote <input id="batch" value="L2026-0001" /></label>
        <label>Fabricação <input id="manufactureDate" type="date" /></label>
        <label>Validade <input id="expiryDate" type="date" /></label>
        <label>Quantidade <input id="quantity" type="number" min="1" max="5000" value="50" /></label>
        <label>Nome do template <input id="templateName" value="template_padrao" /></label>
        <label>Imagem base <input id="baseImage" type="file" accept="image/*" /></label>
        <button id="generateBtn">Gerar etiquetas</button>
      </section>

      <section class="card">
        <h2>2) Prévia em tempo real</h2>
        <canvas id="preview" width="500" height="300"></canvas>
      </section>

      <section class="card full">
        <h2>3) Resultado</h2>
        <button id="downloadJsonBtn" disabled>Baixar lote JSON</button>
        <button id="verifyBtn" disabled>Validar 1ª etiqueta</button>
        <button id="exportPdfBtn" disabled>Exportar PDF para impressão</button>
        <pre id="output"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
